services:
  - type: web
    name: tags-furlong
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Conexion PostgreSQL (Supabase). Se carga a mano en el dashboard de Render,
      # no se versiona en git. Usar el connection string "Session pooler" de Supabase.
      - key: DATABASE_URL
        sync: false
