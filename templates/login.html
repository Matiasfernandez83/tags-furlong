<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingreso · PeajeControl Go</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:#141414;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.caja{background:#fff;border-radius:14px;padding:36px;width:100%;max-width:390px}
.wm{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.wm-stack{display:flex;flex-direction:column;line-height:.86;font-weight:800;color:#141414;letter-spacing:.4px}
.wm-stack div{font-size:22px}
.wm-go{font-family:Georgia,'Times New Roman',serif;font-size:34px;font-weight:900;font-style:italic;
  color:#E30613;letter-spacing:-1px;line-height:.9}
.wm-go b{font-size:24px;vertical-align:top;font-style:normal}
h1{font-weight:900;letter-spacing:1px;font-size:20px}
p{color:#71717a;font-size:13px;margin-bottom:22px}
label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;
  color:#52525b;margin-bottom:6px}
input{width:100%;padding:12px;border:1px solid #d4d4d8;border-radius:8px;font-size:14px;margin-bottom:16px}
button{width:100%;background:#E30613;color:#fff;border:0;padding:13px;border-radius:8px;
  font-weight:800;font-size:14px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
button:hover{background:#c00511}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:11px;
  font-size:13px;margin-bottom:16px}
</style>
</head>
<body>
<form class="caja" method="post">
  <div class="wm">
    <div class="wm-stack"><div>Peajes</div><div>Control</div></div>
    <div class="wm-go"><b>+</b>GO</div>
  </div>
  <h1>Iniciar sesión</h1>
  <p>Control de peajes y gastos de flota</p>
  {% with msgs = get_flashed_messages() %}
    {% for m in msgs %}<div class="err">{{ m }}</div>{% endfor %}
  {% endwith %}
  <label>Correo</label>
  <input type="email" name="email" required autofocus placeholder="tu@email.com">
  <label>Clave</label>
  <input type="password" name="clave" required>
  <button type="submit">Ingresar</button>
</form>
</body>
</html>
